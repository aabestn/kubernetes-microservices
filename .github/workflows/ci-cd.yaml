name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.54.2

      - name: Run Unit Tests
        run: go test -v -race -coverprofile=coverage.out ./...

  vulnerability-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build App Image
        run: |
          docker build -t microservices-app:latest -f docker/App.Dockerfile .

      - name: Build Operator Image
        run: |
          docker build -t custom-operator:latest -f docker/Operator.Dockerfile .

      - name: Run Trivy Vulnerability Scanner (App)
        uses: aquasecurity/trivy-action@0.18.0
        with:
          image-ref: 'microservices-app:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner (Operator)
        uses: aquasecurity/trivy-action@0.18.0
        with:
          image-ref: 'custom-operator:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  build-and-push:
    name: Build & Push Container Images
    needs: [lint-and-test, vulnerability-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (App)
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/app
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Extract Metadata (Operator)
        id: meta-operator
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/operator
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/App.Dockerfile
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}

      - name: Build and Push Operator Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Operator.Dockerfile
          push: true
          tags: ${{ steps.meta-operator.outputs.tags }}
          labels: ${{ steps.meta-operator.outputs.labels }}